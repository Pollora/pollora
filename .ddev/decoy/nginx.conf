# Answers anything with a 200 carrying a cookie.
#
# The cookie is the whole point: a response without one never reaches
# WP_Http_Cookie, and the scenario would pass while proving nothing.
server {
    listen 80 default_server;
    server_name _;

    location / {
        add_header Set-Cookie "pollora_decoy=1; Path=/" always;
        default_type text/html;
        return 200 "<!doctype html><html><head><title>Decoy</title></head><body>A site already answers here.</body></html>";
    }
}
