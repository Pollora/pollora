name: Tests

on:
  push:
    # Release branches too: a release is exactly what wants testing, and it
    # never reaches main until it is tagged — so restricting this to main
    # leaves the install scenarios dormant for the whole stabilisation.
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
  schedule:
    # Nightly, to catch a broken install caused by a new framework or theme release
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.framework }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # locked: what `composer create-project` gives users
        # develop: the next framework release, before it ships
        framework: [locked, develop]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # Same stack as the local Pollora test install
      - name: Configure DDEV
        run: |
          ddev config \
            --project-name=pollora \
            --project-type=wordpress \
            --docroot=public \
            --php-version=8.4 \
            --webserver-type=apache-fpm \
            --database=mariadb:10.11 \
            --nodejs-version=22 \
            --disable-settings-management

      - name: Start DDEV
        run: ddev start

      # Mirrors post-root-package-install, with the DDEV database
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's#^APP_URL=.*#APP_URL=https://pollora.ddev.site#' \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=mysql#' \
            -e 's/^# DB_HOST=.*/DB_HOST=db/' \
            -e 's/^# DB_PORT=.*/DB_PORT=3306/' \
            -e 's/^# DB_DATABASE=.*/DB_DATABASE=db/' \
            -e 's/^# DB_USERNAME=.*/DB_USERNAME=db/' \
            -e 's/^# DB_PASSWORD=.*/DB_PASSWORD=db/' \
            .env

      - name: Install Composer dependencies
        run: ddev composer install --no-interaction --no-progress

      - name: Use framework develop
        if: matrix.framework == 'develop'
        run: ddev composer require pollora/framework:dev-develop --with-all-dependencies --no-interaction --no-progress

      # Mirrors post-create-project-cmd, without prompts
      - name: Generate application key
        run: ddev exec php artisan key:generate --no-interaction

      - name: Install WordPress
        run: |
          ddev exec php artisan pollora:install --install \
            --title="Pollora" \
            --description="Pollora CI" \
            --admin-user=admin \
            --admin-email=admin@example.com \
            --admin-password=pollora-ci-password \
            --locale=en_US \
            --public=false \
            --no-interaction

      - name: Execute tests
        run: ddev composer test

      - name: Execute HTTP integration suite
        run: ddev exec bash -c 'POLLORA_TEST_URL=https://pollora.ddev.site composer test:integration'

      - name: Laravel log
        if: failure()
        run: tail -n 200 storage/logs/laravel.log || true

  # The install path is what four of the six v13.32.0-beta.3 fixes came from,
  # and no test walked it. Each scenario reinstalls the site its own way, so
  # they cannot share a job with each other or with the suite above.
  scenarios:
    name: Install scenario ${{ matrix.scenario }} (${{ matrix.framework }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework: [locked, develop]
        scenario: [artisan, web, no-theme, decoy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure DDEV
        run: |
          ddev config \
            --project-name=pollora \
            --project-type=wordpress \
            --docroot=public \
            --php-version=8.4 \
            --webserver-type=apache-fpm \
            --database=mariadb:10.11 \
            --nodejs-version=22 \
            --disable-settings-management

      # Brings up the decoy server too: .ddev/docker-compose.decoy.yaml is
      # versioned, so `ddev start` picks it up for every scenario.
      - name: Start DDEV
        run: ddev start

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's#^APP_URL=.*#APP_URL=https://pollora.ddev.site#' \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=mysql#' \
            -e 's/^# DB_HOST=.*/DB_HOST=db/' \
            -e 's/^# DB_PORT=.*/DB_PORT=3306/' \
            -e 's/^# DB_DATABASE=.*/DB_DATABASE=db/' \
            -e 's/^# DB_USERNAME=.*/DB_USERNAME=db/' \
            -e 's/^# DB_PASSWORD=.*/DB_PASSWORD=db/' \
            .env

      - name: Install Composer dependencies
        run: ddev composer install --no-interaction --no-progress

      - name: Use framework develop
        if: matrix.framework == 'develop'
        run: ddev composer require pollora/framework:dev-develop --with-all-dependencies --no-interaction --no-progress

      - name: Generate application key
        run: ddev exec php artisan key:generate --no-interaction

      # The scenario does its own install: that is the thing under test.
      - name: Run scenario
        run: |
          ddev exec bash -c '
            POLLORA_INSTALL_TESTS=1 \
            POLLORA_TEST_URL=https://pollora.ddev.site \
            POLLORA_DECOY_URL=http://decoy \
            php tests/install/run.php ${{ matrix.scenario }}
          '

      - name: Laravel log
        if: failure()
        run: tail -n 200 storage/logs/laravel.log || true
